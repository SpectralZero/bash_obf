[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obfush"
version = "2.0.0-dev"
description = "Polymorphic Bash Obfuscation Engine — Red Team Internal Use Only"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Spectral0x00"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Private :: Do Not Upload",
]
dependencies = [
    "bashlex>=0.18",
    "click>=8.1",
    "rich>=13.0",
    "xxhash",
    "PyYAML",
]

[project.optional-dependencies]
gui = [
    "Flask>=3.0,<4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.12",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.1",
    "pyinstaller>=6.10",
]

[project.scripts]
obfush = "obfush.cli:main"

[tool.setuptools.packages.find]
include = ["obfush*"]

[tool.setuptools.package-data]
"obfush.gui" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true
source = ["obfush"]

[tool.coverage.report]
fail_under = 97
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
